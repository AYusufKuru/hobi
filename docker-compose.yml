services:
  postgres:
    image: postgres:16-alpine
    container_name: govorbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: govorbit
      POSTGRES_PASSWORD: govorbit
      POSTGRES_DB: govorbit
    ports:
      - "5432:5432"
    volumes:
      - govorbit_pgdata:/var/lib/postgresql/data

volumes:
  govorbit_pgdata:
